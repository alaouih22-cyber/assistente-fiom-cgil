    <script>
      // Vite HMR is disabled in AI Studio iframe environment.
      // Intercept and silence Vite HMR WebSocket connection to prevent 'WebSocket closed without opened' errors.
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (event && (event.message?.includes('WebSocket') || event.error?.message?.includes('WebSocket'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                            (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('@vite') !== -1));
            if (isViteHmr) {
              var emitter = new EventTarget();
              var dummyWs = {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  dummyWs.readyState = 3;
                  emitter.dispatchEvent(new Event('close'));
                },
                addEventListener: function(type, listener, options) {
                  emitter.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  emitter.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return emitter.dispatchEvent(event);
                }
              };
              setTimeout(function() {
                try { emitter.dispatchEvent(new Event('open')); } catch (e) {}
              }, 0);
              return dummyWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }
      })();
    </script>
