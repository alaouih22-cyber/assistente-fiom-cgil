<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8"/>

  <!-- Steel Coil & Gear Silhouette (CSI Colombella Steel Nastri & Lamiere) -->
  <g filter="url(#shadow)">
    <!-- Gear Teeth Outer -->
    <path d="M256,70 L268,95 L296,96 L305,120 L331,126 L336,151 L360,163 L361,189 L382,206 L377,231 L393,252 L383,276 L393,300 L378,321 L382,347 L361,364 L360,390 L336,402 L331,427 L305,433 L296,457 L268,458 L256,483 L244,458 L216,457 L207,433 L181,427 L176,402 L152,390 L151,364 L130,347 L134,321 L119,300 L129,276 L119,252 L135,231 L130,206 L151,189 L152,163 L176,151 L181,126 L207,120 L216,96 L244,95 Z" fill="#7f1d1d" opacity="0.6"/>

    <!-- Central Steel Coil (Laminatoio / Nastri Arvedi) -->
    <circle cx="256" cy="256" r="140" fill="url(#steelGrad)" stroke="#334155" stroke-width="6"/>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#475569" stroke-width="12" stroke-dasharray="180 30"/>
    <circle cx="256" cy="256" r="65" fill="#991b1b" stroke="url(#goldGrad)" stroke-width="8"/>
    
    <!-- Central Star of Work -->
    <polygon points="256,210 270,245 308,245 277,268 289,302 256,280 223,302 235,268 204,245 242,245" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Banner -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">FIOM-CGIL</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">CSI COLOMBELLA</text>
</svg>
